<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 1. 다크 모드 버튼 추가 (header 위에 넣으세요) -->
  <div style="text-align: right; max-width: 900px; margin: 10px auto;">
    <button onclick="toggleDarkMode()" style="padding: 8px 12px; cursor: pointer; border-radius: 5px; border: none; background-color: #2c3e50; color: white;">다크 모드 🌙</button>
  </div>

  <!-- 기존 코드는 그대로 둡니다 -->
  <div class="container">
    <header>
    <!-- ... 중략 ... -->
  </div>

  <!-- 2. 맨 아래 </body> 바로 위에 스크립트 추가 -->
  <script>
    function toggleDarkMode() {
      document.body.classList.toggle('dark-theme');
    }
  </script>
  <!-- 전체 내용을 감싸는 container 상자 추가 -->
  <div class="container">
    <header>
      <h1>이동주</h1>
      <p>컴소 23학번 언더독 지원자 이동주 입니다.</p>
    </header>

    <main>
      <!-- 프로필 이미지와 소개 글을 가로로 묶을 profile 클래스 추가 -->
      <section class="profile">
        <img src="profile.jpg" alt="프로필 이미지" width="200">
        <div class="profile-text">
          <h2>소개</h2>
          <p>웹 기획부터 서비스 런칭까지 전체 사이클을 경험하기 위해 챌린지에 참여했습니다.</p>
        </div>
      </section>

      <section>
        <h2>관심 분야</h2>
        <ul>
          <li>게임 프로그래밍 및 디자인</li>
          <li>웹사이트 개발 및 실행</li>
          <li>창업적 독창성 아이디어 제시</li>
        </ul>
      </section>

      <section>
          <h2>배우고 싶은 것</h2>
          <ul>
              <li>웹 개발의 전반적인 흐름 이해와 실무 지식</li>
          </ul>
      </section>
    </main>

    <footer>
      <a href="https://github.com/DongJuLee54/underdog">GitHub 방문하기</a>
      <p>만든 사람: 이동주</p>
    </footer>
  </div>
</body>
</html>
